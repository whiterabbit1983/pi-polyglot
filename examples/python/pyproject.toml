[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-polyglot-python-example"
version = "0.1.0"
description = "Independent Python example for the Pi Polyglot wire protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.5", "grpcio==1.85.1", "protobuf==7.36.2"]

[project.scripts]
polyglot-python = "polyglot_example.__main__:main"

[tool.setuptools.packages.find]
include = ["polyglot_example*"]

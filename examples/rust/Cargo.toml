[package]
name = "polyglot-example"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
async-stream = "0.3"
axum = "0.8"
futures-util = "0.3"
prost = "0.13"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tonic = "0.12"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
